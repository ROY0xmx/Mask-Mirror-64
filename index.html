<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>MBTI 64人格 · 测谎版</title>
<style>
  html { color-scheme: light only; background: #f5f5f5; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  *::selection { background: transparent; color: inherit; }
  body { background: #f5f5f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; color-scheme: light only; }
  .test-container { background: #ffffff; border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); padding: 40px 35px; max-width: 800px; width: 100%; border: 1px solid #eaeaea; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 600; color: #0b2b4a; text-align: center; margin-bottom: 8px; letter-spacing: -0.02em; }
  .subhead { text-align: center; color: #4a5b6b; font-size: clamp(0.85rem, 3vw, 1rem); margin-bottom: 24px; border-bottom: 1px solid #e0e0e0; padding-bottom: 18px; }
  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .version-tabs { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; flex: 1; }
  .version-tab { background: #f9fafb; border: 1.5px solid #d6dde3; border-radius: 40px; padding: 9px 20px; font-size: clamp(0.85rem, 3vw, 1rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; }
  .version-tab:hover { background: #fff; border-color: #1e3c5a; }
  .version-tab.active { background: #1e3c5a; border-color: #1e3c5a; color: #fff; }
  .version-tab .badge { display: inline-block; background: #eef1f4; color: #0b2b4a; font-size: 0.72rem; font-weight: 600; padding: 2px 7px; border-radius: 30px; margin-left: 6px; }
  .version-tab.active .badge { background: #fff; color: #0b2b4a; }
  .history-toggle { background: #f9fafb; border: 1.5px solid #d6dde3; border-radius: 40px; padding: 9px 20px; font-size: clamp(0.85rem, 3vw, 0.95rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; white-space: nowrap; }
  .history-toggle:hover { background: #fff; border-color: #1e3c5a; }
  .history-section { margin-bottom: 22px; border: 1px solid #eaeaea; background: #f9fafb; border-radius: 18px; padding: 16px 18px; }
  .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: #0b2b4a; font-weight: 600; font-size: 1rem; }
  .history-clear { background: none; border: none; color: #4a5b6b; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }
  .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
  .history-item { background: #fff; border: 1px solid #eaeaea; border-radius: 12px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; cursor: pointer; transition: all 0.2s; }
  .history-item:hover { border-color: #1e3c5a; box-shadow: 0 4px 12px rgba(30,60,90,0.08); }
  .history-item .h-type { font-weight: 700; color: #0b2b4a; font-size: 1rem; }
  .history-item .h-meta { font-size: 0.8rem; color: #6b7d8f; }
  .history-empty { color: #8a9aa8; font-size: 0.9rem; padding: 4px 0; }
  .progress-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-weight: 500; gap: 8px; flex-wrap: wrap; }
  .question-counter { background: #f0f2f4; padding: 6px 14px; border-radius: 30px; font-size: 0.85rem; color: #0b2b4a; border: 1px solid #d6dde3; white-space: nowrap; }
  .progress-bar-bg { flex-grow: 1; min-width: 100px; height: 8px; background: #e9ecef; border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 8px; background: #1e3c5a; width: 0%; border-radius: 10px; transition: width .15s ease; }
  .question-text { font-size: clamp(1.05rem, 4vw, 1.4rem); font-weight: 500; color: #0b2b4a; line-height: 1.45; margin-bottom: 26px; min-height: 70px; display: flex; align-items: center; }
  .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
  .option-btn { background: #f9fafb; border: 1.5px solid #d6dde3; border-radius: 16px; padding: 14px 18px; font-size: clamp(0.9rem, 3.2vw, 1rem); font-weight: 500; color: #1e3c5a; text-align: left; cursor: pointer; transition: all .1s ease; display: flex; align-items: flex-start; line-height: 1.45; word-break: break-word; }
  .option-btn:hover { background: #fff; border-color: #1e3c5a; box-shadow: 0 4px 12px rgba(0,20,40,.06); }
  .option-btn.selected { background: #fff; border-color: #1e3c5a; border-width: 2px; box-shadow: 0 4px 14px rgba(20,50,80,.1); }
  .option-letter { display: inline-block; width: 24px; height: 24px; background: #eef1f4; border-radius: 50%; text-align: center; line-height: 24px; font-size: 0.8rem; font-weight: 600; color: #0b2b4a; margin-right: 12px; flex-shrink: 0; margin-top: 1px; }
  .option-btn.selected .option-letter { background: #1e3c5a; color: #fff; }
  .nav-buttons { display: flex; justify-content: space-between; gap: 12px; }
  .nav-btn { background: #fff; border: 1.5px solid #d6dde3; border-radius: 40px; padding: 11px 26px; font-size: clamp(0.9rem, 3vw, 1rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; flex: 1; }
  .nav-btn:hover:not(:disabled) { background: #f0f4f8; border-color: #1e3c5a; }
  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  .nav-btn.primary { background: #1e3c5a; border-color: #1e3c5a; color: #fff; }
  .nav-btn.primary:hover:not(:disabled) { background: #0b2b4a; border-color: #0b2b4a; }
  .result-screen { padding: 10px 0 6px; }
  .result-header { text-align: center; margin-bottom: 8px; }
  .result-dual { display: flex; justify-content: center; align-items: center; gap: clamp(12px, 4vw, 28px); flex-wrap: wrap; margin-bottom: 20px; }
  .result-type-block { text-align: center; flex: 1; min-width: 140px; }
  .result-label { font-size: 0.75rem; font-weight: 600; color: #6b7d8f; letter-spacing: 0.05em; margin-bottom: 4px; text-transform: uppercase; }
  .result-type { font-size: clamp(2rem, 9vw, 3.2rem); font-weight: 700; color: #0b2b4a; letter-spacing: 1px; line-height: 1.1; }
  .result-type-inner { color: #1e3c5a; }
  .result-arrow { font-size: clamp(1.2rem, 4vw, 1.8rem); color: #b0c4d4; font-weight: 300; }
  .result-title { font-size: clamp(1.2rem, 4.5vw, 1.6rem); font-weight: 500; color: #1e3c5a; margin-bottom: 6px; text-align: center; }
  .result-tagline { font-size: clamp(0.85rem, 3vw, 1rem); color: #4a5b6b; margin-bottom: 20px; text-align: center; }
  .disguise-meter { background: #f9fafb; border: 1px solid #eaeaea; border-radius: 18px; padding: 14px 18px; margin-bottom: 24px; }
  .disguise-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 600; color: #0b2b4a; margin-bottom: 8px; }
  .disguise-track { height: 14px; background: #e9ecef; border-radius: 20px; overflow: hidden; }
  .disguise-fill { height: 100%; background: #1e3c5a; border-radius: 20px; transition: width .3s ease; }
  .disguise-note { font-size: 0.78rem; color: #6b7d8f; margin-top: 8px; }
  .dims-bar { display: flex; flex-direction: column; gap: 10px; background: #f9fafb; border: 1px solid #eaeaea; border-radius: 18px; padding: 16px 18px; margin-bottom: 26px; }
  .dim-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #1e3c5a; }
  .dim-label { width: 46px; font-weight: 600; color: #0b2b4a; text-align: center; font-size: 0.8rem; flex-shrink: 0; }
  .dim-track { flex-grow: 1; min-width: 60px; height: 18px; background: #e9ecef; border-radius: 20px; overflow: hidden; display: flex; }
  .dim-fill-left { height: 100%; background: #1e3c5a; }
  .dim-fill-right { height: 100%; background: #b0c4d4; }
  .dim-pct { width: 40px; text-align: right; font-weight: 500; color: #1e3c5a; font-size: 0.8rem; flex-shrink: 0; }
  .result-desc { font-size: clamp(0.9rem, 3.2vw, 1rem); color: #3f5567; line-height: 1.85; margin-bottom: 26px; border-top: 1px solid #e0e0e0; padding-top: 22px; }
  .result-desc p { margin-bottom: 16px; text-indent: 2em; text-align: justify; }
  .result-desc h3 { font-size: 1.15rem; color: #0b2b4a; margin: 28px 0 14px; font-weight: 600; border-left: 4px solid #1e3c5a; padding-left: 10px; text-indent: 0; }
  .result-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 30px; }
  .restart-btn { background: #fff; border: 1.5px solid #1e3c5a; border-radius: 40px; padding: 13px 36px; font-size: clamp(0.95rem, 3vw, 1.05rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; }
  .restart-btn:hover { background: #1e3c5a; color: #fff; }
  .hidden { display: none; }
  @media (max-width: 560px) {
    body { padding: 0; }
    .test-container { border-radius: 0; border: none; box-shadow: none; padding: 20px 16px 30px; min-height: 100vh; }
    .top-bar { flex-direction: row; align-items: center; }
    .version-tabs { justify-content: flex-start; gap: 8px; }
    .version-tab { padding: 7px 14px; }
    .history-toggle { padding: 7px 14px; align-self: center; }
    .question-text { min-height: 60px; }
    .option-btn { padding: 12px 14px; }
    .option-letter { width: 22px; height: 22px; line-height: 22px; font-size: 0.75rem; margin-right: 10px; }
    .nav-btn { padding: 11px 16px; }
    .dims-bar { padding: 14px 14px; }
    .result-desc { padding-top: 18px; }
  }
  @media (max-width: 380px) {
    .version-tab .badge { display: none; }
    .dim-label { width: 38px; font-size: 0.75rem; }
  }
</style>
</head>
<body>
<div class="test-container">
  <h1>MBTI 64人格 · 测谎版</h1>
  <div class="subhead">表面亚型 vs 内在亚型 · 三阶深度解析</div>

  <div class="top-bar">
    <div class="version-tabs">
      <button class="version-tab active" data-version="40">极简版 <span class="badge">40题</span></button>
      <button class="version-tab" data-version="100">普通版 <span class="badge">100题</span></button>
      <button class="version-tab" data-version="200">深度思考版 <span class="badge">200题</span></button>
    </div>
    <button class="history-toggle" id="mainHistoryToggle">历史记录</button>
  </div>

  <div class="history-section hidden" id="mainHistorySection">
    <div class="history-header">
      <span>测试历史（点击可查看解析）</span>
      <button class="history-clear" id="mainHistoryClear">清空</button>
    </div>
    <div class="history-list" id="mainHistoryList"></div>
  </div>

  <div id="quizArea">
    <div class="progress-area">
      <span class="question-counter" id="counter">1 / 40</span>
      <div class="progress-bar-bg"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
    </div>
    <div class="question-text" id="questionText">正在加载...</div>
    <div class="options" id="optionsContainer"></div>
    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn" disabled>上一题</button>
      <button class="nav-btn primary" id="nextBtn">下一题</button>
    </div>
  </div>

  <div id="resultArea" class="result-screen hidden">
    <div class="result-header">
      <div class="result-dual">
        <div class="result-type-block">
          <div class="result-label">表面亚型</div>
          <div class="result-type" id="resultTypeOuter">—</div>
        </div>
        <div class="result-arrow">⇄</div>
        <div class="result-type-block">
          <div class="result-label">内在亚型</div>
          <div class="result-type result-type-inner" id="resultTypeInner">—</div>
        </div>
      </div>
      <div class="result-title" id="resultTitle">—</div>
      <div class="result-tagline" id="resultTagline"></div>
    </div>
    <div class="disguise-meter">
      <div class="disguise-head"><span>伪装指数</span><span id="disguisePct">0%</span></div>
      <div class="disguise-track"><div class="disguise-fill" id="disguiseFill" style="width:0%"></div></div>
      <div class="disguise-note" id="disguiseNote"></div>
    </div>
    <div class="dims-bar" id="dimsBar"></div>
    <div class="result-desc" id="resultDesc"></div>
    <div class="result-actions">
      <button class="restart-btn" id="restartBtn">重新测试</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ============================================================
  // 40题（极简版）独立题库 —— 40 条完全唯一
  // ============================================================
  const SIMPLE_BASE = [
    { text: "在热闹的聚会上，你通常会：", options: [{ label: "主动和很多人打招呼，越热闹越有精神", value: "E" }, { label: "找一两个聊得来的人深入交流", value: "I" }, { label: "先观察现场，再决定要不要加入", value: "I" }, { label: "成为话题中心，带动整场气氛", value: "E" }] },
    { text: "接手一个完全陌生的项目，你的第一步是：", options: [{ label: "先动手做，边做边找感觉", value: "S" }, { label: "先想清楚整体框架和可能的路径", value: "N" }, { label: "翻出以往类似案例照着走", value: "S" }, { label: "先 brainstorm 一堆创意方向", value: "N" }] },
    { text: "在做重要决定时，你更信任：", options: [{ label: "数据、事实和逻辑推演", value: "T" }, { label: "自己的感受和它对他人的影响", value: "F" }, { label: "公平的规则和效率优先", value: "T" }, { label: "人情关系和整体和谐", value: "F" }] },
    { text: "你的日常生活节奏更像：", options: [{ label: "有清晰的日程表，按部就班", value: "J" }, { label: "随性而行，看当天心情", value: "P" }, { label: "有大框架，细节灵活调整", value: "J" }, { label: "走到哪算哪，享受意外", value: "P" }] },
    { text: "当你需要给自己“充电”时，你会选择：", options: [{ label: "约朋友出门，热闹一场", value: "E" }, { label: "一个人待着，安静看书或听歌", value: "I" }, { label: "参加集体活动，感受人群氛围", value: "E" }, { label: "独自散步、发呆或写点东西", value: "I" }] },
    { text: "你更容易被什么吸引注意力？", options: [{ label: "具体的细节、事实和现实状况", value: "S" }, { label: "背后的模式、隐喻和未来可能", value: "N" }, { label: "眼前亟待解决的实际问题", value: "S" }, { label: "事物深层含义和长远走向", value: "N" }] },
    { text: "当冲突发生时，你的第一反应是：", options: [{ label: "直接指出问题，就事论事", value: "T" }, { label: "先考虑对方情绪，尽量温和", value: "F" }, { label: "用事实和逻辑把道理讲清楚", value: "T" }, { label: "先安抚情绪，再慢慢沟通", value: "F" }] },
    { text: "你的书桌或工作区更接近：", options: [{ label: "物品分类清楚，井井有条", value: "J" }, { label: "看起来有点乱，但自己找得到", value: "P" }, { label: "文件按项目或主题归档", value: "J" }, { label: "东西随手放，用时再翻", value: "P" }] },
    { text: "你更享受哪一种对话？", options: [{ label: "聊现实生活、具体经验和操作", value: "S" }, { label: "聊抽象概念、未来设想和意义", value: "N" }, { label: "讨论实际步骤和落地方法", value: "S" }, { label: "聊理想、哲学和可能性", value: "N" }] },
    { text: "下面哪句话你更认同？", options: [{ label: "情感是决策中不可忽视的因素", value: "F" }, { label: "公平的规则比个人感受更重要", value: "T" }, { label: "理解他人感受是首要的", value: "F" }, { label: "逻辑一致才是解决问题的关键", value: "T" }] },
    { text: "出门旅行前，你通常会：", options: [{ label: "做详细攻略，把行程排好", value: "J" }, { label: "订好交通住宿，其他随缘", value: "P" }, { label: "列出必去景点和时间表", value: "J" }, { label: "到了再说，享受即兴探索", value: "P" }] },
    { text: "你觉得自己更偏向：", options: [{ label: "在人群中获得能量", value: "E" }, { label: "在独处中恢复精力", value: "I" }, { label: "喜欢热闹，但也需要独处", value: "E" }, { label: "社交后需要长时间安静", value: "I" }] },
    { text: "你更容易记住：", options: [{ label: "具体的数字、事实和细节", value: "S" }, { label: "整体印象和当时的感觉", value: "N" }, { label: "事件的经过和关键细节", value: "S" }, { label: "事情带来的启发和意义", value: "N" }] },
    { text: "朋友向你倾诉烦恼时，你更倾向于：", options: [{ label: "帮他分析问题，给出方案", value: "T" }, { label: "先共情，让他感到被理解", value: "F" }, { label: "指出问题所在，理性建议", value: "T" }, { label: "耐心倾听，给予情感支持", value: "F" }] },
    { text: "你更喜欢哪种工作环境？", options: [{ label: "流程清晰、截止日期明确", value: "J" }, { label: "弹性自由、可自行安排", value: "P" }, { label: "结构清楚、职责分明", value: "J" }, { label: "灵活多变、鼓励即兴", value: "P" }] },
    { text: "在社交场合，你通常：", options: [{ label: "主动和陌生人打开话匣", value: "E" }, { label: "等别人来和你搭话", value: "I" }, { label: "很快融入群体，谈笑风生", value: "E" }, { label: "只和少数人深入交流", value: "I" }] },
    { text: "你更倾向于相信：", options: [{ label: "眼见为实，经验最可靠", value: "S" }, { label: "直觉和灵感带来的启发", value: "N" }, { label: "经过验证的事实和数据", value: "S" }, { label: "内心的预感与洞见", value: "N" }] },
    { text: "你更看重一个人的：", options: [{ label: "能力和逻辑清晰度", value: "T" }, { label: "善良和情感细腻度", value: "F" }, { label: "公正和原则性", value: "T" }, { label: "同理心和包容度", value: "F" }] },
    { text: "对于还没完成的任务，你会：", options: [{ label: "感到不安，想尽快做完", value: "J" }, { label: "觉得可以灵活处理，不急", value: "P" }, { label: "制定计划逐步推进", value: "J" }, { label: "先放一放，等状态好了再做", value: "P" }] },
    { text: "你更常是：", options: [{ label: "先行动，再思考", value: "E" }, { label: "先思考，再行动", value: "I" }, { label: "边做边说，享受互动", value: "E" }, { label: "想清楚再表达", value: "I" }] },
    { text: "你更容易被什么说服？", options: [{ label: "数据和案例", value: "S" }, { label: "理念和愿景", value: "N" }, { label: "真实发生的事例", value: "S" }, { label: "富有想象力的蓝图", value: "N" }] },
    { text: "你更愿意成为：", options: [{ label: "公正的裁判", value: "T" }, { label: "温暖的倾听者", value: "F" }, { label: "客观的分析者", value: "T" }, { label: "贴心的支持者", value: "F" }] },
    { text: "你更喜欢做：", options: [{ label: "已经知道怎么做的事", value: "J" }, { label: "需要即兴发挥的事", value: "P" }, { label: "有明确步骤的任务", value: "J" }, { label: "充满变数的挑战", value: "P" }] },

  const POOL_INTRO = [
    `你在 <strong>{diffDims}</strong> 维度上出现了明显的撕裂。这意味着你在某些时候，不得不“表演”出另一个自己。这种表演并非虚伪，而是你的心理防御机制为了适应环境而做出的妥协。`,
    `你的表里人格在 <strong>{diffDims}</strong> 这几个维度上并不重合。你常在特定场合里“演”出一个更安全的版本，而把真实反应留在心里。`,
    `在 <strong>{diffDims}</strong> 上，你的“对外版本”和“对内版本”是两套逻辑。这不是欺骗，而是你在长期与环境磨合中学会的生存策略。`,
    `你的表面与内在在 <strong>{diffDims}</strong> 上出现了错位。你很清楚自己什么时候在“端着”，也很清楚为什么必须这样。`,
    `表里差异集中在 <strong>{diffDims}</strong>。你在这些维度上给自己加了一层滤镜，让外界更容易接纳你，也让你自己更安全。`,

    `在 <strong>{diffDims}</strong> 上，你并不是“变成另一个人”，而是把真实的一面暂时收起来，换上一个更适配场景的版本。`,
    `你的伪装发生在 <strong>{diffDims}</strong>。它像一件合身但不透气的衣服：穿出去体面，脱下来才觉得活过来。`,
    `表里错位落在 <strong>{diffDims}</strong>。你在这些维度上长期做着一件不容易的事——一边表演，一边不让自己彻底信以为真。`,

  const POOL_NO_DISGUISE = [
    `恭喜你，你是一个非常罕见、表里如一的真实个体。你不需要戴着面具生活，你呈现给世界的就是你内心的样子。这种高度的自洽让你内耗极低，但也意味着你在面对复杂的社会环境时，可能少了一些“圆滑”和“保护色”。你不需要刻意去学虚伪，保持这份真诚，就是对你最大的奖赏。`,
    `你的表里人格完全重合，这是很少见的结果。你不太需要“切换版本”来获得安全感，真实本身对你来说就是最省力的活法。代价是，你在需要圆滑的场合会显得有点“直”。`,

    `你是那种“表里一套系统”的人。这让你内耗极低，也让你在面对弯弯绕绕时容易吃亏。你的功课不是学伪装，而是学会在保持真实的同时给自己留余地。`,

    `你没有戴面具。你的情绪、判断、节奏，基本都是原样输出。这让你活得坦荡，也让你在需要“收着点”的场合显得有些锋利。`,

  const POOL_EI_FAKE_E = [
    `你为什么会“假外向”？你表面上看起来热情、健谈、喜欢社交（表面 E），但你的内心深处其实极度渴望安静和独处（内在 I）。你之所以伪装成外向，大概率是因为在这个社会里，内向常常被误解为“不合群”或“高冷”。你害怕被孤立，或者因为工作需要不得不去社交。你在人群中的大笑和应酬，其实是在疯狂消耗你的能量。每次聚会结束后，你都需要用好几天的独处来回血。你最大的伪装，就是假装自己“毫不费力”地融入人群。`,
    `你的“假外向”是一层社交保护色。你对外热络、会接话、能撑场，但真正的你靠独处回血。你不是不喜欢人，你只是不喜欢“一直在线”。每次热闹散场，你都需要一段无人打扰的时间把电量一点点充回来。`,
    `你在外面扮演着一个“好相处的人”：主动、随和、不掉链子。但你心里清楚，社交对你来说是支出，不是收入。你之所以还在演，多半是因为不演的成本更高——怕被说不合群，怕失去机会，怕让人失望。`,
    `你的外向是练出来的，不是天生的。你能在人群里谈笑风生，但你真正放松的时刻，是一个人待着、不用回应任何人的时候。你的伪装不是虚伪，是你为了不被边缘化而付出的体力活。`,
    `你对外是“气氛组成员”，对内是“需要静音的人”。你能撑起一场社交，但撑完之后往往需要长时间独处才能恢复。你最大的疲惫，不是社交本身，而是“明明想撤还得笑着留下”。`,
    `你把外向当成一件工具：需要时穿上，不需要时脱下。但工具穿久了也会累。你真正渴望的，是有人能接受你安静、不热络、甚至有点冷淡的那一面，而不是只喜欢你“会来事”的样子。`,

    `你对外表现得毫不费力，其实每一步都在用力。你怕冷场、怕被落下、怕别人觉得你难相处，所以你把自己调成了“外向模式”。但调得越久，你越想念那个不用表演的自己。`,
    `你的外向是“应对型”的：需要应付就应付，需要热络就热络。但你的底色是安静的，你的能量来自独处。你最大的伪装，是让别人以为你“天生就适合人群”。`

  const POOL_EI_FAKE_I = [
    `你为什么会“假内向”？你表面上看起来文静、收敛、不爱出风头（表面 I），但你的内心深处其实充满了表达的欲望，极其渴望与人互动（内在 E）。你伪装成内向，可能是因为你在成长过程中曾被批评过“太吵”、“太出风头”，或者你害怕自己的热情会被别人冷落。你为了自我保护，选择了沉默和退缩。但实际上，你内心有一个巨大的舞台，你渴望被看见、被倾听、被掌声包围。`,

    `你对外表现得收敛，其实内心戏很足。你会在心里把一句话排练好几遍，最后还是没说出口。你的“假内向”不是不喜欢人，是怕自己的热情落空。`,

    `你的“务实”是一层必要的壳。你对外讲流程、讲细节、讲落地，但你脑子里真正在转的，是可能性、趋势和“如果换成另一种方式会怎样”。你不是不懂现实，你只是不想被现实框死。`,

    `你的“假装务实”来自一种生存压力：这个环境奖励“看得见摸得着”的东西。所以你学会了用具体的语言包装抽象的想法，也学会了在需要时把想象力收起来。`,
    `你对外是“靠谱的执行者”，对内是“停不下来的想象者”。你不是没有细节能力，你只是不愿意把全部精力都放在细节上。你真正想讨论的，是方向、是意义、是下一步。`,
    `你把“务实”当成一张通行证：先让人相信你靠得住，你才有机会谈那些更远的东西。这是一种策略，也是一种妥协。`,

  ];

  const POOL_SN_FAKE_N = [
    `你为什么会“装作高深”？你对外表现得喜欢谈论意义、抽象概念、未来愿景（表面 N），但你的骨子里其实是一个极其注重现实感官、关注当下细节的人（内在 S）。你伪装成直觉型，可能是因为你觉得谈论柴米油盐太俗气，或者你所在的圈子推崇“深度思考”。你会强迫自己去读那些晦涩的哲学书，去说那些听起来很高深的词汇，但你内心最真实的渴望，不过是一顿美食、一个舒服的觉，和一个看得见摸得着的拥抱。`,
    `你的“高深”是一层社交语言。你对外谈概念、谈趋势、谈格局，但你真正在意的，是今天过得舒不舒服、这件事做起来顺不顺手、这个人靠不靠谱。`,
    `你在外面像个“想得很远的人”，其实你更相信“看得见的东西”。你不是不懂抽象，你只是觉得抽象离生活太远。你最踏实的时刻，往往是具体的、可感的、当下的。`,
    `你的“假高深”来自一种环境压力：会讲大词的人更容易被认真对待。所以你学会了用概念说话，但你心里清楚，真正让你安心的，是一顿好饭、一个好觉、一个不用猜的人。`,
    `你对外能聊哲学、聊愿景、聊意义，但你骨子里是个“体验派”。你不排斥思考，但你更相信身体知道答案：舒服就是舒服，不舒服就是不舒服。`,
    `你把“深刻”当成一种社交货币。你能聊得很深，但你不一定真的想聊那么深。你真正想说的是：今天天气不错，这顿饭很好吃，跟你待着很舒服。`,
    `你对外表现得关注“大问题”，其实你更在意“小日子”。你不是没有抽象能力，你只是不愿意为了显得有深度而放弃具体的快乐。`,
    `你的“假装高深”是一种适应：在一个推崇“有思想”的环境里，谈具体显得太浅。所以你学会了用更抽象的方式表达。但你内心最真实的渴望，其实很朴素。`,
    `你在人群里常被当成“有想法的人”，其实你只是把“想太多”演得比较像。你真正相信的，是那些能摸到、能尝到、能抱到的东西。`,
    `你的表面“高深”，是一种保护色。你怕被说“没深度”，所以你先说一些听起来有分量的话。但你最放松的时候，是聊那些最具体、最日常、最不需要动脑的事。`
  ];

  const POOL_TF_FAKE_T = [
    `你为什么会“装作冷酷”？你对外表现得极其理智、客观、不讲情面（表面 T），但你内心其实是一个非常柔软、极度共情、容易被感动的人（内在 F）。你伪装成思考型，是因为你曾经因为太善良、太心软而受过伤。你发现“讲感情”在这个世界上容易吃亏，所以你给自己穿上了一层理性的铠甲。你用冷漠来推开别人，其实是害怕自己再次受伤。你的“毒舌”和“冷酷”，往往是你最脆弱的防线。`,
    `你的“冷酷”是一层铠甲。你对外讲逻辑、讲对错、讲效率，但你心里其实很容易被打动。你不是不在乎，你是怕太在乎会受伤，所以先把自己武装成“不好接近”的样子。`,
    `你在外面像个“理性的人”，其实你共情力很强。你能敏锐地感觉到别人的情绪，只是你学会了不表现出来。你的冷静不是天生的，是后天练出来的防御。`,
    `你的“假冷酷”来自一种经验：太心软的人容易被拿捏。所以你学会了先讲道理、先划边界、先显得不好惹。但你心里那个柔软的部分，从来没有真正消失。`,
    `你对外是“就事论事”的人，对内是“很容易共情”的人。你不是没有感情，你只是不敢轻易把感情露出来。你的“毒舌”往往是你在保护自己。`,
    `你把理性当成盾牌。你能在关键时刻保持冷静，但你的冷静里藏着很多没说出口的在意。你越在乎，越容易表现得无所谓。`,
    `你对外表现得“不近人情”，其实你比很多人都更容易被触动。你只是学会了把感动藏起来，把柔软收起来，把“我没事”说得特别像真的。`,
    `你的“冷酷”是选择性展示的。你能讲道理、能分析、能算账，但你在意的人和事，依然会轻易牵动你。你不是不感性，你只是把感性放在了更深的地方。`,
    `你在人群里常被当成“理智型”，其实你只是把情绪管理得很好。你不是没有情绪，你是怕情绪一出来就收不住，所以先让自己看起来冷静。`,
    `你的表面理性，是一种自我保护。你曾经可能因为太善良而吃过亏，所以现在你学会了先冷下来、先讲逻辑、先不让人看出你其实很在意。`
  ];

  const POOL_TF_FAKE_F = [
    `你为什么会“装作随和”？你对外表现得善解人意、脾气温和、甚至有点讨好型（表面 F），但你内心其实极其冷静、甚至觉得周围人的情绪很可笑（内在 T）。你伪装成情感型，是因为你极其聪明地意识到：在人际关系中，“讲道理”是行不通的，唯有提供情绪价值，才能最快地达成目的。你的温柔是一把刀，你的妥协是为了更好地掌控全局。你面带微笑，看着别人为你所用的感觉，让你觉得很安全。`,
    `你的“随和”是一层策略。你对外温和、好说话、会照顾人，但你心里其实在算账。你不是没有判断，你只是知道什么时候该先给情绪、再给结论。`,
    `你在外面像个“老好人”，其实你内心很清醒。你能共情，但你不一定认同；你能安慰，但你不一定买账。你的温柔是选择，不是本能。`,
    `你的“假温柔”来自一种效率判断：讲道理太慢，照顾情绪更快。所以你学会了先顺着、先接住、先让人放下防备。你真正的目的，往往在情绪之后。`,
    `你对外是“很好说话的人”，对内是“很有主见的人”。你不是没有立场，你只是知道直接亮立场会得罪人。你的随和是一种更省力的推进方式。`,
    `你把“善解人意”当成工具。你能准确说出别人想听的话，但你不一定真的那么想。你的温柔里带着距离，你的妥协里带着算计。`,
    `你对外表现得情绪充沛，其实你内心相当冷静。你不是被情绪推着走的人，你是那个在旁边看情绪流动的人。你只是学会了用情绪的语言说话。`,
    `你的“随和”是一种保护：不硬碰硬，不正面冲突，不让人难堪。但你心里有一套自己的标准，谁越过了，你记得比谁都清楚。`,
    `你在人群里常被当成“暖心的人”，其实你只是把理性藏在了温柔后面。你能照顾人，但你不会轻易被人照顾；你能共情，但你不会轻易被带跑。`,
    `你的表面感性，是一种社交智慧。你早就看明白：在很多场合，情绪价值比道理更值钱。所以你选择先给情绪，但你的判断从来没有停过。`
  ];

  const POOL_JP_FAKE_J = [
    `你为什么会“装作自律”？你对外表现得计划性极强、有条理、强迫症（表面 J），但你内心其实极其渴望自由、随性、摆烂（内在 P）。你伪装成判断型，是因为你极度害怕失控。你讨厌不确定的未来，所以你用密密麻麻的计划表来获得安全感。别人以为你是一个自律的机器人，其实你每天都在和自己的拖延症作斗争。`,
    `你的“自律”是一层安全网。你对外列计划、赶进度、守时守约，但你心里其实很想躺平。你不是天生爱计划，你是怕不计划就会乱。`,
    `你在外面像个“很有条理的人”，其实你内心一直在跟拖延拉扯。你的计划表不是享受，是止痛药。你用秩序来压住那种“随时可能失控”的焦虑。`,
    `你的“假自律”来自一种恐惧：怕事情脱轨。所以你提前安排、反复确认、把不确定性压到最低。但你心里清楚，你并不是真的享受“井井有条”。`,
    `你对外是“靠谱的人”，对内是“很想随性的人”。你不是没有拖延的冲动，你只是不敢让它占上风。你的自律，很多时候是硬撑出来的体面。`,
    `你把“计划”当成控制感的来源。你能把事情安排得明明白白，但你的内心其实很累。你不是喜欢规则，你是需要规则来让自己安心。`,
    `你对外表现得极其有秩序，其实你内心常常在喊“我想摆烂”。你不是不会乱，你是太怕乱，所以先把自己管得死死的。`,
    `你的“自律”是一种防御。你怕被别人说“不靠谱”，也怕自己真的失控。所以你用计划、清单、时间表把自己框住。框久了，你也累。`,
    `你在人群里常被当成“执行力强的人”，其实你只是把随性的那一面藏起来了。你不是不想放松，你是怕一放松就收不回来。`,
    `你的表面自律，是一种自我保护。你用秩序对抗不确定，用计划对抗焦虑。但你心里一直有一个更松、更自由的自己，等着被允许出来。`
  ];

  const POOL_JP_FAKE_P = [
    `你为什么会“装作随性”？你对外表现得随遇而安、不拘小节、佛系（表面 P），但你内心其实极度渴望秩序、控制权，以及一个确定的未来（内在 J）。你伪装成知觉型，可能是因为你讨厌别人干涉你的决定，或者你不想让自己看起来“太死板”。你嘴上说着“随便、都行”，其实心里早就有了一个不可更改的标准答案。`,
    `你的“随性”是一层伪装。你对外说“都行”“随便”“看情况”，但你心里其实早有答案。你不是没主见，你只是不想被人安排。`,
    `你在外面像个“佛系的人”，其实你内心很在意秩序和结果。你说“没关系”的时候，往往不是真的没关系，而是不想为这件事起冲突。`,
    `你的“假随性”来自一种边界保护：只要别人不替你决定，你就愿意表现得很好说话。但你心里有一套清晰的标准，只是不轻易亮出来。`,
    `你对外是“随遇而安的人”，对内是“很有计划的人”。你不是不焦虑，你只是把焦虑藏在了“都行”后面。你的“随便”，很多时候是懒得解释。`,
    `你把“佛系”当成一种防御。你怕被说太较真、太控制，所以你学会了先退一步、先说“无所谓”。但你心里那本账，一直记得很清楚。`,
    `你对外表现得随和，其实你内心对“失控”很敏感。你能接受变化，但你不喜欢被突然打乱。你的“都可以”，往往是有前提的。`,
    `你的“随性”是演给关系看的。你不想因为自己的坚持让别人不舒服，所以你先把选择权让出去。但你真正想要的，是别人尊重你的标准。`,
    `你在人群里常被当成“没脾气的人”，其实你只是把较真藏得比较深。你嘴上说“随便”，心里却在默默打分。`,
    `你的表面随性，是一种社交让步。你愿意在小事上表现得无所谓，但你在真正在意的事上，一步都不会退。`
  ];

  const POOL_RELATION = [
    `在亲密关系中，你最容易因为“{diffDims}”的伪装而和伴侣产生隔阂。伴侣往往爱上的是你展现出来的那个“表面人格”，但随着时间的推移，你的“内在人格”会逐渐暴露。这时候，伴侣可能会觉得你“变了”，而你会觉得“原来你还是不懂我”。`,
    `你的亲密关系里有一个隐形矛盾：对方爱上的可能是你的“对外版本”，而你要的却是被“对内版本”接住。你越晚坦白，后面的落差越大。`,
    `在感情里，你最怕的不是吵架，而是“被爱上的不是真正的我”。你的伪装越成功，越容易在关系深入时感到孤独。`,
    `你在亲密关系中的功课，是让伴侣知道：你有些“冷淡/随和/外向/内向”是演的。你不说，对方就会当真；你说了，关系才有机会往下走。`,
    `你的表里差异会在亲密关系里被放大。刚在一起时，对方看到的是你愿意给的样子；相处久了，你真实的那一面会自己冒出来。这不是变心，是藏不住了。`,
    `在感情里，你常常一边演、一边希望对方能看穿。你希望被爱的是真实的你，但你又不敢先把真实的你交出去。`,
    `你在亲密关系里最容易出现的误会是：对方觉得你“变了”，而你觉得“我本来就是这样，只是你之前没看到”。`,
    `你的伪装在亲密关系里既是保护，也是障碍。它保护你不被太快看穿，也阻碍你被真正理解。`,
    `在感情里，你不怕暴露缺点，你怕的是暴露之后对方收回喜欢。所以你先演一个“更好相处”的版本，再慢慢试探。`,
    `你的亲密关系里藏着一个没说出口的请求：请你爱那个没那么“好”的我。你演得越好，这句话越难说出口。`,
    `你在感情里常常是“先给好看的，再给真实的”。这让你在初期很受欢迎，也让你在后期容易疲惫。`,
    `你的表里差异会让伴侣产生一种错觉：你一开始很懂我，后来怎么不懂了。其实不是你变了，是你把真实的自己放出来了。`
  ];

  const POOL_WORK = [
    `在职场中，由于你对 {diffDims} 维度的伪装，你常常处于一种极大的精神内耗中。你强迫自己去符合“外界期待的样子”，但你的本能却在抗议。你可能会在工作中突然感到极度的疲惫和意义缺失，那是因为你的真实性在向你报警。`,
    `你在职场里最大的消耗，不是工作本身，而是“扮演一个更合适的人”。你能演得很好，但演得越好，越容易在下班后感到空。`,
    `你的伪装在职场里是一种生存技能。它帮你拿到机会、避开麻烦，也让你在深夜怀疑：我到底是在工作，还是在演工作。`,
    `在职场中，你常常用“对外版本”换效率，用“对内版本”换喘息。这两套系统同时运行，时间久了会累。`,
    `你的职场疲惫往往不是来自任务量，而是来自“不能做自己”。你可以在会议上表现得很好，但回到工位会觉得被抽空。`,
    `你在职场里的优势是适应力强，代价是长期“演”会磨损你。你需要在某些场合允许自己少演一点。`,
    `你在工作中最容易崩的时刻，不是被批评，而是“演了太久、忘了自己本来怎么想”。`,
    `你的伪装在职场里帮你避开了很多麻烦，也让你很难被真正看见。你被喜欢的，可能是一个“工作版本”的你。`,
    `在职场里，你常常是“那个很配合的人”，但配合久了，你会忘记自己也有不配合的权利。`,
    `你的职场内耗来自“表里两套标准”：一套用来应付流程，一套用来安放自己。两套都在跑，你就很难真正休息。`,
    `你在工作中表现出的样子，很多时候是“策略性选择”，不是“真实偏好”。这不丢人，但你得知道自己什么时候在选。`,
    `你在职场里最需要的，不是更强的伪装，而是一两个可以“不演”的角落。哪怕只有一个，也能让你缓过来。`
  ];

  const POOL_FINAL = [
    `你的伪装，是你在漫长的岁月中，为了保护自己而进化出的铠甲。你不必为自己的“虚伪”感到羞耻，因为那是你生存的智慧。但是，人不能永远穿着铠甲睡觉。你需要找到一些让你感到绝对安全的角落、一些能完全接纳你的人，在那里，你可以毫无顾忌地切换回你的 <strong>{innerType}</strong> 状态。真正的成熟，不是永远只展现真实的一面，也不是永远戴着完美的面具，而是<strong>有选择的能力</strong>。你可以熟练地使用你的面具去应对外界，但你也必须清楚地知道，脱下西装、卸下妆容后，那个 <strong>{innerType}</strong> 才是你灵魂的归宿。去看见那个隐藏在深处的自己，去抱抱那个受了委屈的内在小孩，告诉他/她：“没关系，辛苦了，现在你可以做回你自己了。”`,
    `你的面具不是罪证，是履历。它记录了你如何在不够安全的环境里活下来。但履历不该是全部的人生。你需要一些时刻、一些人，让你可以不用解释、不用表演、不用先想“这样说合不合适”。`,
    `你演得很好，这不代表你是假的。但你需要承认：演久了会累。给自己留几个“可以不演”的场景，比学会更多演技更重要。`,
    `你的伪装保护过你，也可能困住你。真正的自由不是永远真实，而是你知道什么时候可以摘、对谁可以摘。`,
    `你不必把面具全部撕掉，也不必永远戴着。成熟是“有选择”：在该演的场合演，在该做自己的地方，敢于做自己。`,
    `你的表里差异不是缺陷，是你和环境谈判的结果。但谈判要有底线：至少留一个地方，让你不用谈。`,
    `你不需要向全世界坦白，但你需要至少一个人，见过你卸下伪装的样子，并且没有走。`,
    `你的铠甲很合身，但睡觉时还是脱了吧。找到那个让你敢脱铠甲的人或角落，比什么都重要。`,
    `你不是虚伪，你只是太早学会了保护自己。现在你要学的，是保护之外，还允许自己被看见。`,
    `你演得越久，越需要提醒自己：面具是工具，不是身份。你可以用它，但不能只剩它。`
  ];

  const POOL_SHORT_40 = [
    `记住，面具戴久了会长在脸上。适当地卸下伪装，拥抱你真实的内在，你会发现，做自己远比演别人轻松得多。`,
    `以上是你在几个维度上的伪装与真实。你可以问问自己：哪些演是必要的，哪些演已经变成了习惯。`,
    `你的伪装不是错，但你可以选择少演一点。从一个小场景开始，试着让真实的自己出来透透气。`,
    `表里差异不是问题，问题是你是否知道自己在演。知道，就有选择；不知道，就只能一直演下去。`,
    `你不需要立刻改变什么。先看见自己在哪些维度上演、为什么演，就是松动的开始。`,

  // ============================================================

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function prepareQuestions(base, count) {
    let pool = base.slice();
    if (pool.length < count) {
      const extra = [];
      let i = 0;
      while (pool.length + extra.length < count) {
        const q = base[i % base.length];
        extra.push({ text: "换个角度：" + q.text, options: q.options.map(o => ({ label: o.label, value: o.value })) });
        i++;
      }
      pool = pool.concat(extra);
    }
    return shuffle(pool).slice(0, count).map(q => ({
      text: q.text,
      options: shuffle(q.options).map(o => ({ label: o.label, value: o.value }))
    }));
  }

  function getVersionQuestions(version) {
    if (version === 40) return prepareQuestions(SIMPLE_BASE, 40);
    if (version === 100) return prepareQuestions(NORMAL_BASE, 100);
    return prepareQuestions(DEEP_BASE, 200);
  }

  function getLieQuestions(version) {
    if (version === 40) return prepareQuestions(LIE_BASE, 40);
    if (version === 100) return prepareQuestions(LIE_BASE, 100);
    return prepareQuestions(LIE_BASE, 200);
  }

  function resetState(version) {
    currentVersion = version;
    questions = getVersionQuestions(version);
    lieQuestions = getLieQuestions(version);
    currentQuestionIndex = 0;
    answers = new Array(questions.length).fill(null);
    quizArea.classList.remove('hidden');

    versionTabs.forEach(tab => {
      tab.classList.toggle('active', parseInt(tab.dataset.version) === version);
    });
    renderQuestion();
  }

  function updateProgress() {
    const total = questions.length;
    const answered = answers.filter(a => a !== null).length;
    progressFill.style.width = (answered / total) * 100 + '%';
    counter.textContent = (currentQuestionIndex + 1) + ' / ' + total;
  }

  function renderQuestion() {
    const q = questions[currentQuestionIndex];
    questionText.textContent = q.text;
    const saved = answers[currentQuestionIndex];
    optionsContainer.innerHTML = '';
    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      if (saved !== null && saved === opt.value) btn.classList.add('selected');
      btn.innerHTML = '<span class="option-letter">' + String.fromCharCode(65 + idx) + '</span>' + opt.label;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        answers[currentQuestionIndex] = opt.value;
        updateProgress();
        updateNavButtons();
      });
      optionsContainer.appendChild(btn);
    });
    updateProgress();
    updateNavButtons();
  }

  function updateNavButtons() {
    prevBtn.disabled = currentQuestionIndex === 0;
    nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? '查看结果' : '下一题';

    if (!has && currentQuestionIndex < questions.length - 1) nextBtn.disabled = true;
    else nextBtn.disabled = false;
  }

  function goToNext() {
    if (currentQuestionIndex < questions.length - 1) {
      if (answers[currentQuestionIndex] === null) return;
      currentQuestionIndex++;

    } else {

    }
  }

  function goToPrev() {
    if (currentQuestionIndex > 0) {
      currentQuestionIndex--;

  }

  function calculateVariant(counts) {
    const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
    const e = counts.E >= counts.I ? 'E' : 'I';
    const s = counts.S >= counts.N ? 'S' : 'N';
    const t = counts.T >= counts.F ? 'T' : 'F';
    const j = counts.J >= counts.P ? 'J' : 'P';
    const type = e + s + t + j;
    let suffix = '';
    if (counts[e] / total > 0.7) suffix += e;
    if (counts[s] / total > 0.7) suffix += s;
    if (counts[t] / total > 0.7) suffix += t;
    if (counts[j] / total > 0.7) suffix += j;
    if (suffix.length === 0) suffix = 'A';
    else if (suffix.length === 4) suffix = 'T';
    return type + '-' + suffix;
  }

  function calculateOuter() {
    const counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    answers.forEach(v => { if (v && counts.hasOwnProperty(v)) counts[v]++; });
    const variant = calculateVariant(counts);
    return { variant, counts };
  }

  function calculateInner() {
    const counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    lieQuestions.forEach((q, idx) => {
      const ans = answers[idx % answers.length];
      if (ans) {
        const chosen = q.options.find(o => o.value === ans) || q.options[0];
        const innerVal = chosen.value;
        if (counts.hasOwnProperty(innerVal)) counts[innerVal]++;
      }
    });
    const variant = calculateVariant(counts);
    return { variant, counts };
  }

  function renderDims(outerCounts, innerCounts) {
    const totalEI = (outerCounts.E + outerCounts.I + innerCounts.E + innerCounts.I) || 1;
    const totalSN = (outerCounts.S + outerCounts.N + innerCounts.S + innerCounts.N) || 1;
    const totalTF = (outerCounts.T + outerCounts.F + innerCounts.T + innerCounts.F) || 1;
    const totalJP = (outerCounts.J + outerCounts.P + innerCounts.J + innerCounts.P) || 1;
    const dims = [
      { left: 'E', right: 'I', l: ((outerCounts.E + innerCounts.E) / totalEI) * 100 },
      { left: 'S', right: 'N', l: ((outerCounts.S + innerCounts.S) / totalSN) * 100 },
      { left: 'T', right: 'F', l: ((outerCounts.T + innerCounts.T) / totalTF) * 100 },
      { left: 'J', right: 'P', l: ((outerCounts.J + innerCounts.J) / totalJP) * 100 }

    dimsBar.innerHTML = dims.map(d => (
      '<div class="dim-row">' +
        '<span class="dim-label">' + d.left + ' ' + d.right + '</span>' +

        '</div>' +
        '<span class="dim-pct">' + Math.round(d.l) + '%</span>' +
      '</div>'
    )).join('');
  }

    if (sameDims.includes('J/P')) {
      if (outerBase[3] === 'J') {
        html += `<p><strong>生活节奏（J）：</strong>你没有伪装计划性。在你能够掌控的领域里，你是真的喜欢秩序和计划，讨厌被打乱。你不需要假装随性，因为你本来就从秩序中获得安全感。这份真实保护了你：你的执行力和条理性始终在线。</p>`;
      } else {
        html += `<p><strong>生活节奏（P）：</strong>你没有伪装随性。在你觉得安全的环境里，你是真的享受自由和灵活，讨厌被束缚。你不需要假装自律，因为你本来就从随性中获得能量。这份真实保护了你：你的灵活性和适应力始终在线。</p>`;
      }
    }

    if (version === 100) {
      const e = pickRandom(POOL_SHORT_100, used);
      return html + `<p>${fill(e)}</p>`;
    }

    // 深度版：张力 + 亲密关系 + 职场 + 终极救赎
    html += `<h3>【表里张力】伪装与真实之间的内耗</h3>`;
    html += `<p>你最大的消耗，不是来自“伪装”本身，而是来自“伪装与真实之间的反复拉扯”。你知道自己什么时候在演，也知道演完会有多累；你有时想干脆卸下伪装，又怕真实的样子不被接受。这种张力长期存在，会让你在某个阶段感到一种说不清的疲惫——不是身体累，而是“做人好累”。</p>`;
    if (diffDims.includes('T/F')) {
      html += `<p>尤其在 T/F 维度上，你的张力最明显：你用理性去处理关系，心里却在偷偷期待被温柔对待；或者你用温柔去照顾别人，心里却清楚自己并不真的在乎。这种“表里不一”不是道德问题，是你的自我保护机制在运行。</p>`;
    }
    if (diffDims.includes('E/I')) {
      html += `<p>在 E/I 维度上，你的能量账本最不平衡：每次“演”完外向或内向，你都需要付出额外的能量去回血。长期下来，你可能会对社交产生一种“又想去又怕去”的矛盾感。</p>`;
    }

    // 亲密关系（随机池）
    html += `<h3>【亲密关系】你在爱里的伪装与真实</h3>`;
    const rel = pickRandom(POOL_RELATION, used);
    if (rel) html += `<p>${fill(rel)}</p>`;

    if (diffDims.includes('T/F')) {
      html += `<p>你在恋爱中可能会表现出一种“口是心非”。你明明很在意，却要用冷漠去推开对方；或者你明明有自己的小算盘，却要装作无比深情。你需要向伴侣坦白你的真实防御机制，告诉对方：“我有时候推开你，不是不爱，而是我害怕受伤害。”</p>`;
    }
    if (diffDims.includes('E/I')) {
      html += `<p>你在恋爱中最大的痛苦就是能量的错位。你可能会为了迎合伴侣而过度社交，导致自己精疲力尽，然后突然爆发。你需要勇敢地告诉伴侣你的底线：“我需要一个人待一会儿，这与你无关，只是我需要回血。”</p>`;
    }

    // 职场（随机池）
    html += `<h3>【职场博弈】你的生存策略与精神内耗</h3>`;
    const work = pickRandom(POOL_WORK, used);
    if (work) html += `<p>${fill(work)}</p>`;

    if (diffDims.includes('J/P')) {
      html += `<p>在职场中，由于你对 J/P 维度的伪装，你常常处于一种极大的精神内耗中。你强迫自己去符合 ${outerBase[3] === 'J' ? '死板的流程和KPI' : '无组织无纪律的弹性工作'}，但你的本能却在抗议。你可能会在工作中突然感到极度的疲惫和意义缺失，那是因为你的真实性在向你报警。</p>`;
    }
    if (diffDims.includes('S/N')) {
      html += `<p>在解决问题时，你看起来像是 ${outerBase[1] === 'S' ? '一个精算师' : '一个战略家'}，但你真正的杀手锏其实是 ${innerBase[1] === 'S' ? '对现实资源的敏锐把控' : '对底层逻辑的洞察'}。当你敢于在关键时刻展现你真正的内在特质时，往往能爆发出惊人的力量。</p>`;
    }

    // 终极救赎（随机池）
    html += `<h3>【终极救赎】走向人格的完整与真实</h3>`;
    const final = pickRandom(POOL_FINAL, used);
    if (final) html += `<p>${fill(final)}</p>`;

    return html;
  }

  // ============================================================
  // 历史记录
  // ============================================================
  function saveToHistory(outer, inner, version, counts, disguise, descHtml) {
    let history = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
    history.unshift({ outer, inner, version, counts, disguise, descHtml, time: new Date().toLocaleString('zh-CN') });
    if (history.length > 20) history = history.slice(0, 20);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch (e) {}
  }

  function renderHistory() {
    let history = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
    if (!history.length) {
      mainHistoryList.innerHTML = '<div class="history-empty">暂无历史记录</div>';
      return;
    }
    mainHistoryList.innerHTML = history.map((h, index) => (
      '<div class="history-item" onclick="window.viewHistoryItem(' + index + ')">' +
        '<span class="h-type">表 ' + h.outer + ' → 内 ' + h.inner + '</span>' +
        '<span class="h-meta">' + h.version + '题 · ' + h.time + ' 点击查看解析</span>' +
      '</div>'
    )).join('');
  }

  window.viewHistoryItem = function(index) {
    let history = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
    const item = history[index];
    if (!item) return;

    const outerBase = item.outer.substring(0, 4);
    const innerBase = item.inner.substring(0, 4);
    const outerInfo = TYPE_DESC[outerBase] || { title: '探索者', tag: '独特的人格组合' };
    const innerInfo = TYPE_DESC[innerBase] || { title: '探索者', tag: '独特的人格组合' };

    resultTypeOuter.textContent = item.outer;
    resultTypeInner.textContent = item.inner;
    resultTitle.textContent = '表面 ' + outerInfo.title + ' × 内在 ' + innerInfo.title;
    resultTagline.textContent = '表面亚型：' + outerInfo.tag + ' ｜ 内在亚型：' + innerInfo.tag;
    disguisePct.textContent = item.disguise + '%';
    disguiseFill.style.width = item.disguise + '%';
    disguiseNote.textContent = getDisguiseNote(item.disguise);
    renderDims(item.counts.outer, item.counts.inner);
    resultDesc.innerHTML = item.descHtml;

    quizArea.classList.add('hidden');
    resultArea.classList.remove('hidden');
    mainHistorySection.classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  function showResult() {
    if (answers.some(a => a === null)) {
      for (let i = 0; i < answers.length; i++) {
        if (answers[i] === null) {
          currentQuestionIndex = i;
          renderQuestion();
          return;
        }
      }
    }

    const outer = calculateOuter();
    const inner = calculateInner();

    const outerBase = outer.variant.substring(0, 4);
    const innerBase = inner.variant.substring(0, 4);
    const outerInfo = TYPE_DESC[outerBase] || { title: '探索者', tag: '独特的人格组合' };
    const innerInfo = TYPE_DESC[innerBase] || { title: '探索者', tag: '独特的人格组合' };

    const disguise = getDisguiseLevel(outerBase, innerBase);

    resultTypeOuter.textContent = outer.variant;
    resultTypeInner.textContent = inner.variant;
    resultTitle.textContent = '表面 ' + outerInfo.title + ' × 内在 ' + innerInfo.title;
    resultTagline.textContent = '表面亚型：' + outerInfo.tag + ' ｜ 内在亚型：' + innerInfo.tag;
    disguisePct.textContent = disguise + '%';
    disguiseFill.style.width = disguise + '%';
    disguiseNote.textContent = getDisguiseNote(disguise);
    renderDims(outer.counts, inner.counts);

    const descHtml = generateDetailedText(outer.variant, inner.variant, disguise, currentVersion);
    resultDesc.innerHTML = descHtml;

    quizArea.classList.add('hidden');
    resultArea.classList.remove('hidden');
    saveToHistory(outer.variant, inner.variant, currentVersion, { outer: outer.counts, inner: inner.counts }, disguise, descHtml);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function restartTest() {
    currentQuestionIndex = 0;
    answers = new Array(questions.length).fill(null);
    resultArea.classList.add('hidden');
    quizArea.classList.remove('hidden');
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ============================================================
  // 事件绑定
  // ============================================================
  versionTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const v = parseInt(tab.dataset.version);
      if (v !== currentVersion) resetState(v);
    });
  });

  nextBtn.addEventListener('click', goToNext);
  prevBtn.addEventListener('click', goToPrev);
  restartBtn.addEventListener('click', restartTest);

  mainHistoryToggle.addEventListener('click', () => {
    if (mainHistorySection.classList.contains('hidden')) {
      renderHistory();
      mainHistorySection.classList.remove('hidden');
    } else {
      mainHistorySection.classList.add('hidden');
    }
  });

  mainHistoryClear.addEventListener('click', () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    renderHistory();
  });

  // ============================================================
  // 启动
  // ============================================================
  resetState(40);
})();
</script>
</body>
</html>
