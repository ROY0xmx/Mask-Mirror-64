<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
  html { color-scheme: light only; background: #f5f5f5; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  .version-tabs { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; flex: 1; }
  .version-tab { background: #f9fafb; border: 1.5px solid #d6dde3; border-radius: 40px; padding: 9px 20px; font-size: clamp(0.85rem, 3vw, 1rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; }

  .version-tab .badge { display: inline-block; background: #eef1f4; color: #0b2b4a; font-size: 0.72rem; font-weight: 600; padding: 2px 7px; border-radius: 30px; margin-left: 6px; }
  .version-tab.active .badge { background: #fff; color: #0b2b4a; }
  .history-toggle { background: #f9fafb; border: 1.5px solid #d6dde3; border-radius: 40px; padding: 9px 20px; font-size: clamp(0.85rem, 3vw, 0.95rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; white-space: nowrap; }
  .history-toggle:hover { background: #fff; border-color: #1e3c5a; }
  .history-section { margin-bottom: 22px; border: 1px solid #eaeaea; background: #f9fafb; border-radius: 18px; padding: 16px 18px; }
  .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: #0b2b4a; font-weight: 600; font-size: 1rem; }
  .history-clear { background: none; border: none; color: #4a5b6b; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }
  .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
  .history-item { background: #fff; border: 1px solid #eaeaea; border-radius: 12px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; cursor: pointer; transition: all 0.2s; }

  .progress-bar-bg { flex-grow: 1; min-width: 100px; height: 8px; background: #e9ecef; border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 8px; background: #1e3c5a; width: 0%; border-radius: 10px; transition: width .15s ease; }
  .question-text { font-size: clamp(1.05rem, 4vw, 1.4rem); font-weight: 500; color: #0b2b4a; line-height: 1.45; margin-bottom: 26px; min-height: 70px; display: flex; align-items: center; }
  .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }

  .option-btn:hover { background: #fff; border-color: #1e3c5a; box-shadow: 0 4px 12px rgba(0,20,40,.06); }
  .option-btn.selected { background: #fff; border-color: #1e3c5a; border-width: 2px; box-shadow: 0 4px 14px rgba(20,50,80,.1); }
  .option-letter { display: inline-block; width: 24px; height: 24px; background: #eef1f4; border-radius: 50%; text-align: center; line-height: 24px; font-size: 0.8rem; font-weight: 600; color: #0b2b4a; margin-right: 12px; flex-shrink: 0; margin-top: 1px; }
  .option-btn.selected .option-letter { background: #1e3c5a; color: #fff; }
  .nav-buttons { display: flex; justify-content: space-between; gap: 12px; }
  .nav-btn { background: #fff; border: 1.5px solid #d6dde3; border-radius: 40px; padding: 11px 26px; font-size: clamp(0.9rem, 3vw, 1rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; flex: 1; }
  .nav-btn:hover:not(:disabled) { background: #f0f4f8; border-color: #1e3c5a; }

  .nav-btn.primary { background: #1e3c5a; border-color: #1e3c5a; color: #fff; }
  .nav-btn.primary:hover:not(:disabled) { background: #0b2b4a; border-color: #0b2b4a; }
  .result-screen { padding: 10px 0 6px; }
  .result-header { text-align: center; margin-bottom: 8px; }
  .result-dual { display: flex; justify-content: center; align-items: center; gap: clamp(12px, 4vw, 28px); flex-wrap: wrap; margin-bottom: 20px; }
  .result-type-block { text-align: center; flex: 1; min-width: 140px; }
  .result-label { font-size: 0.75rem; font-weight: 600; color: #6b7d8f; letter-spacing: 0.05em; margin-bottom: 4px; text-transform: uppercase; }
  .result-type { font-size: clamp(2rem, 9vw, 3.2rem); font-weight: 700; color: #0b2b4a; letter-spacing: 1px; line-height: 1.1; }
  .result-type-inner { color: #1e3c5a; }
  .result-arrow { font-size: clamp(1.2rem, 4vw, 1.8rem); color: #b0c4d4; font-weight: 300; }
  .result-title { font-size: clamp(1.2rem, 4.5vw, 1.6rem); font-weight: 500; color: #1e3c5a; margin-bottom: 6px; text-align: center; }
  .result-tagline { font-size: clamp(0.85rem, 3vw, 1rem); color: #4a5b6b; margin-bottom: 20px; text-align: center; }
  .disguise-meter { background: #f9fafb; border: 1px solid #eaeaea; border-radius: 18px; padding: 14px 18px; margin-bottom: 24px; }
  .disguise-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 600; color: #0b2b4a; margin-bottom: 8px; }
  .disguise-track { height: 14px; background: #e9ecef; border-radius: 20px; overflow: hidden; }
  .disguise-fill { height: 100%; background: #1e3c5a; border-radius: 20px; transition: width .3s ease; }
  .disguise-note { font-size: 0.78rem; color: #6b7d8f; margin-top: 8px; }
  .dims-bar { display: flex; flex-direction: column; gap: 10px; background: #f9fafb; border: 1px solid #eaeaea; border-radius: 18px; padding: 16px 18px; margin-bottom: 26px; }
  .dim-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #1e3c5a; }
  .dim-label { width: 46px; font-weight: 600; color: #0b2b4a; text-align: center; font-size: 0.8rem; flex-shrink: 0; }
  .dim-track { flex-grow: 1; min-width: 60px; height: 18px; background: #e9ecef; border-radius: 20px; overflow: hidden; display: flex; }
  .dim-fill-left { height: 100%; background: #1e3c5a; }
  .dim-fill-right { height: 100%; background: #b0c4d4; }
  .dim-pct { width: 40px; text-align: right; font-weight: 500; color: #1e3c5a; font-size: 0.8rem; flex-shrink: 0; }
  .result-desc { font-size: clamp(0.9rem, 3.2vw, 1rem); color: #3f5567; line-height: 1.85; margin-bottom: 26px; border-top: 1px solid #e0e0e0; padding-top: 22px; }
  .result-desc p { margin-bottom: 16px; text-indent: 2em; text-align: justify; }
  .result-desc h3 { font-size: 1.15rem; color: #0b2b4a; margin: 28px 0 14px; font-weight: 600; border-left: 4px solid #1e3c5a; padding-left: 10px; text-indent: 0; }
  .result-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 30px; }
  .restart-btn { background: #fff; border: 1.5px solid #1e3c5a; border-radius: 40px; padding: 13px 36px; font-size: clamp(0.95rem, 3vw, 1.05rem); font-weight: 500; color: #1e3c5a; cursor: pointer; transition: all .1s ease; }
  .restart-btn:hover { background: #1e3c5a; color: #fff; }
  .hidden { display: none; }
  @media (max-width: 560px) {
    body { padding: 0; }
    .test-container { border-radius: 0; border: none; box-shadow: none; padding: 20px 16px 30px; min-height: 100vh; }
    .top-bar { flex-direction: row; align-items: center; }
    .version-tabs { justify-content: flex-start; gap: 8px; }
    .version-tab { padding: 7px 14px; }
    .history-toggle { padding: 7px 14px; align-self: center; }
    .question-text { min-height: 60px; }
    .option-btn { padding: 12px 14px; }
    .option-letter { width: 22px; height: 22px; line-height: 22px; font-size: 0.75rem; margin-right: 10px; }
    .nav-btn { padding: 11px 16px; }
    .dims-bar { padding: 14px 14px; }
    .result-desc { padding-top: 18px; }
  }
  @media (max-width: 380px) {
    .version-tab .badge { display: none; }
    .dim-label { width: 38px; font-size: 0.75rem; }
  }
</style>
</head>
<body>
<div class="test-container">
  <h1>MBTI 64人格 · 测谎版</h1>
  <div class="subhead">表面亚型 vs 内在亚型 · 三阶深度解析</div>

  <div class="top-bar">
    <div class="version-tabs">
      <button class="version-tab active" data-version="40">极简版 <span class="badge">40题</span></button>
      <button class="version-tab" data-version="100">普通版 <span class="badge">100题</span></button>
      <button class="version-tab" data-version="200">深度思考版 <span class="badge">200题</span></button>
    </div>
    <button class="history-toggle" id="mainHistoryToggle">历史记录</button>
  </div>

  <div class="history-section hidden" id="mainHistorySection">
    <div class="history-header">
      <span>测试历史（点击可查看解析）</span>
      <button class="history-clear" id="mainHistoryClear">清空</button>
    </div>
    <div class="history-list" id="mainHistoryList"></div>
  </div>

  <div id="quizArea">
    <div class="progress-area">
      <span class="question-counter" id="counter">1 / 40</span>
      <div class="progress-bar-bg"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
    </div>
    <div class="question-text" id="questionText">正在加载...</div>
    <div class="options" id="optionsContainer"></div>
    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn" disabled>上一题</button>
      <button class="nav-btn primary" id="nextBtn">下一题</button>
    </div>
  </div>

  <div id="resultArea" class="result-screen hidden">
    <div class="result-header">
      <div class="result-dual">
        <div class="result-type-block">
          <div class="result-label">表面亚型</div>
          <div class="result-type" id="resultTypeOuter">—</div>
        </div>
        <div class="result-arrow">⇄</div>
        <div class="result-type-block">
          <div class="result-label">内在亚型</div>
          <div class="result-type result-type-inner" id="resultTypeInner">—</div>
        </div>
      </div>
      <div class="result-title" id="resultTitle">—</div>
      <div class="result-tagline" id="resultTagline"></div>
    </div>
    <div class="disguise-meter">
      <div class="disguise-head"><span>伪装指数</span><span id="disguisePct">0%</span></div>
      <div class="disguise-track"><div class="disguise-fill" id="disguiseFill" style="width:0%"></div></div>
      <div class="disguise-note" id="disguiseNote"></div>
    </div>
    <div class="dims-bar" id="dimsBar"></div>
    <div class="result-desc" id="resultDesc"></div>
    <div class="result-actions">
      <button class="restart-btn" id="restartBtn">重新测试</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ==========================================

  const SIMPLE_BASE = [

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function prepareQuestions(base, count) {
    let pool = base.slice();
    if (pool.length < count) {
      const extra = [];
      let i = 0;
      while (pool.length + extra.length < count) {
        const q = base[i % base.length];
        extra.push({
          text: "换个角度：" + q.text,
          options: q.options.map(o => ({ label: o.label, value: o.value }))
        });
        i++;
      }
      pool = pool.concat(extra);
    }
    const shuffled = shuffle(pool).slice(0, count);
    return shuffled.map(q => ({
      text: q.text,
      options: shuffle(q.options).map(o => ({ label: o.label, value: o.value }))
    }));
  }

  function calculateVariant(counts) {
    const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
    const e = counts.E >= counts.I ? 'E' : 'I';
    const s = counts.S >= counts.N ? 'S' : 'N';
    const t = counts.T >= counts.F ? 'T' : 'F';
    const j = counts.J >= counts.P ? 'J' : 'P';
    
    const type = e + s + t + j;
    
    let suffix = '';
    if (counts[e] / total > 0.7) suffix += e;
    if (counts[s] / total > 0.7) suffix += s;
    if (counts[t] / total > 0.7) suffix += t;
    if (counts[j] / total > 0.7) suffix += j;
    
    if (suffix.length === 0) {
      suffix = 'A';
    } else if (suffix.length === 4) {
      suffix = 'T';
    }
    
    return type + '-' + suffix;
  }

  function calculateOuter() {
    const counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    answers.forEach(v => { if (v && counts.hasOwnProperty(v)) counts[v]++; });
    const variant = calculateVariant(counts);
    return { variant, counts };
  }

  function calculateInner() {
    const counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    lieQuestions.forEach((q, idx) => {
      const ans = answers[idx % answers.length];
      if (ans) {
        const chosen = q.options.find(o => o.value === ans) || q.options[0];
        const innerVal = chosen.value;
        if (counts.hasOwnProperty(innerVal)) counts[innerVal]++;
      }
    });
    const variant = calculateVariant(counts);
    return { variant, counts };
  }

    const totalJP = (outerCounts.J + outerCounts.P + innerCounts.J + innerCounts.P) || 1;
    const dims = [
      { left: 'E', right: 'I', l: ((outerCounts.E + innerCounts.E) / totalEI) * 100 },
      { left: 'S', right: 'N', l: ((outerCounts.S + innerCounts.S) / totalSN) * 100 },

        html += `<p><strong>你为什么会“装作冷酷”？</strong> 你对外表现得极其理智、客观、不讲情面（表面 T），但你内心其实是一个非常柔软、极度共情、容易被感动的人（内在 F）。你伪装成思考型，是因为你曾经因为太善良、太心软而受过伤。你发现“讲感情”在这个世界上容易吃亏，所以你给自己穿上了一层理性的铠甲。你用冷漠来推开别人，其实是害怕自己再次受伤。你的“毒舌”和“冷酷”，往往是你最脆弱的防线。</p>`;
      } else {
        html += `<p><strong>你为什么会“装作随和”？</strong> 你对外表现得善解人意、脾气温和、甚至有点讨好型（表面 F），但你内心其实极其冷静、甚至觉得周围人的情绪很可笑（内在 T）。你伪装成情感型，是因为你极其聪明地意识到：在人际关系中，“讲道理”是行不通的，唯有提供情绪价值，才能最快地达成目的。你的温柔是一把刀，你的妥协是为了更好地掌控全局。你面带微笑，看着别人为你所用的感觉，让你觉得很安全。</p>`;
      }
    }

    if (diffDims.includes('J/P')) {
      const oJ = outerBase[3] === 'J';
      const iJ = innerBase[3] === 'J';
      if (oJ && !iJ) {
        html += `<p><strong>你为什么会“装作自律”？</strong> 你对外表现得计划性极强、有条理、强迫症（表面 J），但你内心其实极其渴望自由、随性、摆烂（内在 P）。你伪装成判断型，是因为你极度害怕失控。你讨厌不确定的未来，所以你用密密麻麻的计划表来获得安全感。别人以为你是一个自律的机器人，其实你每天都在和自己的拖延症作斗争。</p>`;
      } else {
        html += `<p><strong>你为什么会“装作随性”？</strong> 你对外表现得随遇而安、不拘小节、佛系（表面 P），但你内心其实极度渴望秩序、控制权，以及一个确定的未来（内在 J）。你伪装成知觉型，可能是因为你讨厌别人干涉你的决定，或者你不想让自己看起来“太死板”。你嘴上说着“随便、都行”，其实心里早就有了一个不可更改的标准答案。</p>`;
      }
    }

    // --- 真实未被伪装的部分 ---
    html += `<h3>【真实底色】你没有伪装的部分</h3>`;
    if (disguise === 0) {
      html += `<p>你的所有特质都是真实的。你不需要区分哪里是面具，哪里是本质。${innerInfo.tag}就是你的本色。</p>`;
    } else {
      const sameDims = [];
      if (outerBase[0] === innerBase[0]) sameDims.push(`能量倾向（${outerBase[0]}）`);
      if (outerBase[1] === innerBase[1]) sameDims.push(`信息获取（${outerBase[1]}）`);
      if (outerBase[2] === innerBase[2]) sameDims.push(`决策方式（${outerBase[2]}）`);
      if (outerBase[3] === innerBase[3]) sameDims.push(`生活节奏（${outerBase[3]}）`);
      
      html += `<p>无论你在外面怎么伪装，你的 <strong>${sameDims.join('、')}</strong> 是绝对真实的，这是你最不肯妥协的部分。</p>`;
      
      if (outerBase[0] === innerBase[0]) {
        html += `<p>在 <strong>能量倾向</strong> 上，你没有伪装。你是一个真实的 ${outerBase[0] === 'E' ? '外向者' : '内向者'}。${outerBase[0] === 'E' ? '你确实喜欢和人打交道，社交能给你带来真正的快乐，而不只是为了应酬。' : '你确实需要大量的独处空间，只有在安静的时候，你才觉得可以做回自己。'}</p>`;
      }
      if (outerBase[1] === innerBase[1]) {
        html += `<p>在 <strong>信息获取</strong> 上，你没有伪装。你是一个真实的 ${outerBase[1] === 'S' ? '实感者' : '直觉者'}。${outerBase[1] === 'S' ? '你确实关注现实和细节，那些看得见摸得着的东西才能给你安全感。' : '你确实总是脑洞大开，思考未来的可能性，那些宏大的概念才是你的精神食粮。'}</p>`;
      }
      if (outerBase[2] === innerBase[2]) {
        html += `<p>在 <strong>决策方式</strong> 上，你没有伪装。你是一个真实的 ${outerBase[2] === 'T' ? '思考者' : '情感者'}。${outerBase[2] === 'T' ? '在面对核心利益和原则问题时，你确实会保持绝对的理智，不会被感情左右。' : '在面对你在意的人和事时，你确实会感情用事，哪怕知道不理智，你也愿意为了感情买单。'}</p>`;
      }
      if (outerBase[3] === innerBase[3]) {
        html += `<p>在 <strong>生活节奏</strong> 上，你没有伪装。你是一个真实的 ${outerBase[3] === 'J' ? '判断者' : '知觉者'}。${outerBase[3] === 'J' ? '在你能掌控的领域里，你确实喜欢计划和秩序，讨厌被打乱。' : '在你觉得安全的环境里，你确实喜欢随性自由，讨厌被束缚。'}</p>`;
      }
    }

    if (version === 40) {
      return html + `<p>记住，面具戴久了会长在脸上。适当地卸下伪装，拥抱你真实的内在，你会发现，做自己远比演别人轻松得多。</p>`;
    }

    // --- 普通版与深度版专属：场景化深度分析 ---
    html += `<h3>【亲密关系】你在爱里的伪装与真实</h3>`;
    if (disguise > 0) {
      html += `<p>在亲密关系中，你最容易因为“${diffDims.join('、')}”的伪装而和伴侣产生隔阂。伴侣往往爱上的是你展现出来的那个“表面人格”，但随着时间的推移，你的“内在人格”会逐渐暴露。这时候，伴侣可能会觉得你“变了”，而你会觉得“原来你还是不懂我”。</p>`;
      if (diffDims.includes('T/F')) {
        html += `<p>如果你伪装了 T/F 维度，你在恋爱中可能会表现出一种“口是心非”。你明明很在意，却要用冷漠去推开对方；或者你明明有自己的小算盘，却要装作无比深情。你需要向伴侣坦白你的真实防御机制，告诉对方：“我有时候推开你，不是不爱，而是我害怕受伤害。”</p>`;
      }
      if (diffDims.includes('E/I')) {
        html += `<p>如果你伪装了 E/I 维度，你在恋爱中最大的痛苦就是能量的错位。你可能会为了迎合伴侣而过度社交，导致自己精疲力尽，然后突然爆发。你需要勇敢地告诉伴侣你的底线：“我需要一个人待一会儿，这与你无关，只是我需要回血。”</p>`;
      }
    } else {
      html += `<p>你在感情中表里如一，这让你的伴侣非常有安全感。你不会藏着掖着，开心就是开心，生气就是生气。但也因为缺乏弹性，你们在吵架时，可能很难找到回旋的余地。适当地在非原则问题上妥协，是你需要学习的课题。</p>`;
    }

    if (version === 100) {
      return html + `<p>以上是为你量身定制的深度解析。接受自己的面具，理解自己的防御机制，也珍视自己未被伪装的真实底色，你会走得更远。</p>`;
    }

    // --- 深度版专属：压力、职场与终极救赎 ---
    html += `<h3>【职场博弈】你的生存策略与精神内耗</h3>`;
    if (diffDims.includes('J/P')) {
      html += `<p>在职场中，由于你对 J/P 维度的伪装，你常常处于一种极大的精神内耗中。你强迫自己去符合 ${outerBase[3] === 'J' ? '死板的流程和KPI' : '无组织无纪律的弹性工作'}，但你的本能却在抗议。你可能会在工作中突然感到极度的疲惫和意义缺失，那是因为你的真实性在向你报警。</p>`;
    }
    if (diffDims.includes('S/N')) {
      html += `<p>在解决问题时，你看起来像是 ${outerBase[1] === 'S' ? '一个精算师' : '一个战略家'}，但你真正的杀手锏其实是 ${innerBase[1] === 'S' ? '对现实资源的敏锐把控' : '对底层逻辑的洞察'}。当你敢于在关键时刻展现你真正的内在特质时，往往能爆发出惊人的力量。</p>`;
    }

    html += `<h3>【终极救赎】走向人格的完整与真实</h3>`;
    html += `<p>你的伪装，是你在漫长的岁月中，为了保护自己而进化出的铠甲。你不必为自己的“虚伪”感到羞耻，因为那是你生存的智慧。</p>`;
    html += `<p>但是，人不能永远穿着铠甲睡觉。你需要找到一些让你感到绝对安全的角落、一些能完全接纳你的人，在那里，你可以毫无顾忌地切换回你的 <strong>${innerType}</strong> 状态。</p>`;
    html += `<p>真正的成熟，不是永远只展现真实的一面，也不是永远戴着完美的面具，而是<strong>有选择的能力</strong>。你可以熟练地使用你的面具去应对外界，但你也必须清楚地知道，脱下西装、卸下妆容后，那个 <strong>${innerType}</strong> 才是你灵魂的归宿。</p>`;
    html += `<p>去看见那个隐藏在深处的自己，去抱抱那个受了委屈的内在小孩，告诉他/她：“没关系，辛苦了，现在你可以做回你自己了。”</p>`;

    return html;
  }

  function saveToHistory(outer, inner, version, counts, disguise, descHtml) {
    let history = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
    history.unshift({
      outer,
      inner,
      version,
      counts,
      disguise,
      descHtml,
      time: new Date().toLocaleString('zh-CN')
    });
    if (history.length > 20) history = history.slice(0, 20);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch (e) {}
  }

  function renderHistory() {
    let history = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
    if (!history.length) {
      mainHistoryList.innerHTML = '<div class="history-empty">暂无历史记录</div>';
      return;
    }
    mainHistoryList.innerHTML = history.map((h, index) => (
      '<div class="history-item" onclick="window.viewHistoryItem(' + index + ')">' +
        '<span class="h-type">表 ' + h.outer + ' → 内 ' + h.inner + '</span>' +
        '<span class="h-meta">' + h.version + '题 · ' + h.time + ' 点击查看解析</span>' +
      '</div>'
    )).join('');
  }

  window.viewHistoryItem = function(index) {
    let history = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
    const item = history[index];
    if (!item) return;
    
    const outerBase = item.outer.substring(0, 4);
    const innerBase = item.inner.substring(0, 4);
    const outerInfo = TYPE_DESC[outerBase] || { title: '探索者', tag: '独特的人格组合' };
    const innerInfo = TYPE_DESC[innerBase] || { title: '探索者', tag: '独特的人格组合' };
    
    resultTypeOuter.textContent = item.outer;
    resultTypeInner.textContent = item.inner;
    resultTitle.textContent = '表面 ' + outerInfo.title + ' × 内在 ' + innerInfo.title;
    resultTagline.textContent = '表面亚型：' + outerInfo.tag + ' ｜ 内在亚型：' + innerInfo.tag;
    disguisePct.textContent = item.disguise + '%';
    disguiseFill.style.width = item.disguise + '%';
    disguiseNote.textContent = getDisguiseNote(item.disguise);
    renderDims(item.counts.outer, item.counts.inner);
    resultDesc.innerHTML = item.descHtml;
    
    quizArea.classList.add('hidden');
    resultArea.classList.remove('hidden');
    mainHistorySection.classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  function getDisguiseLevel(outerType, innerType) {
    let diff = 0;
    for (let i = 0; i < 4; i++) {
      if (outerType[i] !== innerType[i]) diff++;
    }
    return Math.round((diff / 4) * 100);
  }

  function getDisguiseNote(pct) {
    if (pct === 0) return '你的表面人格与内在人格高度一致。你呈现给世界的，基本就是真实的自己。这是一种难得的坦诚。';
    if (pct <= 25) return '你大部分时候是真实的，只有某一维度上会不自觉地“修饰”自己。这种小伪装通常是社交润滑，不必过于在意。';
    if (pct <= 50) return '你在两个维度上呈现出表里差异。你可能在某些场合习惯性地戴上面具，但内心始终知道真实的自己是什么样。';
    if (pct <= 75) return '你的表面人格与内在人格有较大差异。你可能长期在扮演一个“更安全”的角色，而真实的自己被藏得比较深。';
    return '你的表面人格与内在人格几乎完全不同。你可能非常擅长适应环境，也可能已经很久没有问过自己“我真正想要什么”。这是一个值得认真对待的信号。';
  }

  function showResult() {
    if (answers.some(a => a === null)) {
      for (let i = 0; i < answers.length; i++) {
        if (answers[i] === null) {
          currentQuestionIndex = i;
          renderQuestion();
          return;
        }
      }
    }
    
    const outer = calculateOuter();
    const inner = calculateInner();
    
    const outerBase = outer.variant.substring(0, 4);
    const innerBase = inner.variant.substring(0, 4);
    const outerInfo = TYPE_DESC[outerBase] || { title: '探索者', tag: '独特的人格组合' };
    const innerInfo = TYPE_DESC[innerBase] || { title: '探索者', tag: '独特的人格组合' };
    
    const disguise = getDisguiseLevel(outerBase, innerBase);

    resultTypeOuter.textContent = outer.variant;
    resultTypeInner.textContent = inner.variant;
    resultTitle.textContent = '表面 ' + outerInfo.title + ' × 内在 ' + innerInfo.title;
    resultTagline.textContent = '表面亚型：' + outerInfo.tag + ' ｜ 内在亚型：' + innerInfo.tag;
    disguisePct.textContent = disguise + '%';
    disguiseFill.style.width = disguise + '%';
    disguiseNote.textContent = getDisguiseNote(disguise);
    renderDims(outer.counts, inner.counts);

    const descHtml = generateDetailedText(outer.variant, inner.variant, disguise, currentVersion);
    resultDesc.innerHTML = descHtml;
      
    quizArea.classList.add('hidden');
    resultArea.classList.remove('hidden');
    saveToHistory(outer.variant, inner.variant, currentVersion, { outer: outer.counts, inner: inner.counts }, disguise, descHtml);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function restartTest() {
    currentQuestionIndex = 0;
    answers = new Array(questions.length).fill(null);
    resultArea.classList.add('hidden');
    quizArea.classList.remove('hidden');
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  versionTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const v = parseInt(tab.dataset.version);
      if (v !== currentVersion) resetState(v);
    });
  });

  nextBtn.addEventListener('click', goToNext);
  prevBtn.addEventListener('click', goToPrev);
  restartBtn.addEventListener('click', restartTest);

  mainHistoryToggle.addEventListener('click', () => {
    if (mainHistorySection.classList.contains('hidden')) {
      renderHistory();
      mainHistorySection.classList.remove('hidden');
    } else {
      mainHistorySection.classList.add('hidden');
    }
  });

  mainHistoryClear.addEventListener('click', () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    renderHistory();
  });

  resetState(40);
})();
</script>
</body>
</html>
